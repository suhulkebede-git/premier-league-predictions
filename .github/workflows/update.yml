name: Update standings

on:
  schedule:
    # Every 15 minutes across PL kick-off windows (11:00-23:59 UTC, any day,
    # so midweek rounds are covered), plus every 6 hours otherwise.
    - cron: "*/15 11-23 * * *"
    - cron: "0 */6 * * *"
  workflow_dispatch: # "Run workflow" button for a manual update
  push:
    branches: [main]
    paths: ["site/**", "data/**", "src/**"]

permissions:
  contents: write # to commit data/history.json when a gameweek's scorers are recorded
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install .
      - name: Score everyone against the live table
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: plpredict run --out site/standings.json
      - name: Save scorer history
        # Only changes when a gameweek finishes or is backfilled (~38 times a season).
        # Pushes made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
        run: |
          if git diff --quiet -- data/history.json; then
            echo "No new scorer history"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git commit -m "chore(history): record gameweek scorer history"
          git pull --rebase --quiet origin main
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
