name: Update standings

on:
  schedule:
    # Every 15 minutes across PL kick-off windows (11:00-23:59 UTC, any day,
    # so midweek rounds are covered), plus every 6 hours otherwise.
    - cron: "*/15 11-23 * * *"
    - cron: "0 */6 * * *"
  workflow_dispatch: # "Run workflow" button for a manual update
  push:
    branches: [main]
    paths: ["site/**", "data/**", "src/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install .
      - name: Score everyone against the live table
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: plpredict run --out site/standings.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
